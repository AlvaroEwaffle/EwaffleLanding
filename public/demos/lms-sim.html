<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Simulador LMS · SCORM 1.2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#11131a;color:#e8eaed;display:grid;grid-template-columns:1fr 420px;height:100vh}
iframe{width:100%;height:100%;border:0;background:#fff}
.panel{border-left:1px solid #2a2e3a;display:flex;flex-direction:column;overflow:hidden}
.panel h1{font-size:14px;padding:14px 16px;background:#191c25;border-bottom:1px solid #2a2e3a;font-weight:700}
.state{padding:14px 16px;border-bottom:1px solid #2a2e3a;font-size:13px}
.state div{display:flex;justify-content:space-between;padding:4px 0}
.state b{font-family:ui-monospace,Menlo,monospace}
.k{color:#8b93a7}
.v{font-family:ui-monospace,Menlo,monospace}
.v.completed{color:#38d39f;font-weight:700}
.v.incomplete{color:#f0b429}
.log{flex:1;overflow:auto;padding:10px 16px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.65}
.log div{padding:2px 0;border-bottom:1px solid #1c1f28}
.fn{color:#7aa2f7}
.ok{color:#38d39f}
.arg{color:#c0caf5}
</style></head>
<body>
<iframe id="sco"></iframe>
<div class="panel">
  <h1>Simulador LMS · SCORM 1.2</h1>
  <div class="state">
    <div><span class="k">API encontrada</span><span class="v" id="s-api">esperando…</span></div>
    <div><span class="k">lesson_status</span><span class="v" id="s-status">not attempted</span></div>
    <div><span class="k">llamadas</span><span class="v" id="s-calls">0</span></div>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
// ── El LMS falso. Expone window.API con la firma SCORM 1.2 y registra todo. ──
var cmi = { "cmi.core.lesson_status": "not attempted", "cmi.core.student_name": "Prueba, Ewaffle", "cmi.core.lesson_location": "" };
var calls = 0;
function log(fn, args, ret) {
  calls++;
  document.getElementById("s-calls").textContent = calls;
  var d = document.createElement("div");
  d.innerHTML = '<span class="fn">' + fn + '</span>(<span class="arg">' + args + '</span>) → <span class="ok">' + ret + '</span>';
  var L = document.getElementById("log"); L.appendChild(d); L.scrollTop = L.scrollHeight;
}
function paint() {
  var st = cmi["cmi.core.lesson_status"];
  var el = document.getElementById("s-status");
  el.textContent = st; el.className = "v " + st.replace(/\s/g, "");
}
window.API = {
  LMSInitialize: function (s) { document.getElementById("s-api").textContent = "sí"; log("LMSInitialize", '""', "true"); return "true"; },
  LMSFinish: function (s) { log("LMSFinish", '""', "true"); return "true"; },
  LMSGetValue: function (k) { var v = cmi[k] !== undefined ? cmi[k] : ""; log("LMSGetValue", '"' + k + '"', '"' + v + '"'); return v; },
  LMSSetValue: function (k, v) { cmi[k] = v; paint(); log("LMSSetValue", '"' + k + '", "' + v + '"', "true"); return "true"; },
  LMSCommit: function (s) { log("LMSCommit", '""', "true"); return "true"; },
  LMSGetLastError: function () { return "0"; },
  LMSGetErrorString: function (c) { return "No error"; },
  LMSGetDiagnostic: function (c) { return ""; }
};
document.getElementById("sco").src = "buffalo-induccion-scorm/index.html";
</script>
</body></html>
