<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo · hotspot del plano (m4-r2)</title>
<style>
  /* Tokens del curso de referencia (buffalo-induccion-juegos.html). El accent de Buffalo es
     ROJO, así que acierto y error no pueden salir de él — regla 3 de games.mjs. Verde y rojo
     de estado son fijos y viven aparte del cromo de marca. */
  :root{
    --bg:#f6f7f8; --paper:#fff; --ink:#1d2021; --muted:#6b7280; --line:#e3e6e8;
    --accent:#c9222d; --ok:#0f7a52; --warn:#b45309;
    /* Los colores de estado NO se inventan: games.mjs ya los fija sobre .game como
       --g-ok (= el verde del curso) y --g-no (#d9534f). Usar otros haría que esta
       actividad se viera de otra aplicación al ponerla entre dos párrafos del curso. */
    --g-ok:#0f7a52; --g-no:#d9534f;
    --zona:#eef1f3; --zona-borde:#cfd6da;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:20px 16px 60px}
  .wrap{max-width:620px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  .meta{color:var(--muted);font-size:13px;margin:0 0 18px}

  .game{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
  .g-pregunta{font-size:17px;font-weight:700;margin:0 0 4px}
  .g-ayuda{font-size:13.5px;color:var(--muted);margin:0 0 14px}

  /* ── el plano ──────────────────────────────────────────────────────────────
     Rejilla de proporción FIJA (4:3). No hay reflow entre breakpoints: la
     disposición relativa de las zonas es idéntica en cualquier ancho, que es
     justamente lo que hace que el aprendizaje sea espacial — si el plano se
     reordenara en el teléfono, "dónde está" dejaría de ser una respuesta estable.
     Todo escala proporcionalmente con el contenedor. */
  .plano{
    display:grid; aspect-ratio:4/3; width:100%; gap:6px;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:1.05fr 1fr 1fr 1.15fr;
    grid-template-areas:
      "sala sala sala sala"
      "caja arma arma arma"
      "caja wafl wafl wafl"
      "prel refr lava seco";
    padding:8px; background:var(--bg); border:1px solid var(--line); border-radius:12px;
    /* Sin arrastre: cada zona es un botón y se toca. `manipulation` saca el retardo de
       300ms del doble-tap sin desactivar el scroll de la página. */
    touch-action:manipulation;
  }
  .z{
    grid-area:var(--a); border:1.5px dashed var(--zona-borde); background:var(--zona);
    border-radius:9px; display:grid; place-items:center; text-align:center;
    font:inherit; font-size:12.5px; font-weight:700; color:var(--muted);
    cursor:pointer; padding:4px; min-width:0; min-height:0;
  }
  .z:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .z .n{opacity:0}                      /* sin ubicar: la zona está en blanco */
  .z.puesta{border-style:solid;border-color:var(--g-ok);background:#eefaf5;color:var(--g-ok)}
  /* El glifo va ADEMÁS del color: regla del motor, el 8% de los operarios no distingue
     verde de rojo. Acá además la zona ubicada muestra su nombre y la pendiente está en
     blanco, así que hay una segunda señal no cromática de serie. */
  .z.puesta .n::before{content:"✓ ";font-weight:800}
  .z.puesta .n{opacity:1}
  .z.mal{border-color:var(--g-no);background:#fbeaea;color:var(--g-no);animation:no .3s}
  .z.pista{border-color:var(--warn);background:#fdf4e6;color:var(--warn)}
  @keyframes no{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  @media (prefers-reduced-motion:reduce){.z{animation:none!important}}

  .frente,.fondo{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
                 color:var(--muted);text-align:center;padding:5px 0}

  .g-resp{margin-top:12px;font-size:14px;min-height:1.5em}
  .g-resp.ok{color:var(--g-ok)}
  .g-resp.mal{color:var(--g-no)}
  .g-ficha{margin-top:12px;background:var(--bg);border-left:3px solid var(--g-ok);
           border-radius:8px;padding:11px 13px;font-size:14px}
  .g-ficha b{display:block;margin-bottom:5px}
  .g-ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
  .g-ficha dt{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .g-ficha dd{margin:0;font-size:13.5px}
  .g-btn{font:inherit;font-size:14px;padding:9px 16px;min-height:44px;border-radius:9px;
         border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;margin-top:12px}
  .g-nota{margin-top:14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
  .g-prog{font-size:12.5px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
</style>

<div class="wrap">
  <h1>Prototipo · hotspot del plano</h1>
  <p class="meta">m4-r2 · 8 zonas · sirve para medir blancos de toque, no es la implementación</p>

  <div class="game" id="g">
    <div class="g-prog" id="prog">0 de 8 ubicadas</div>
    <p class="g-pregunta" id="preg"></p>
    <p class="g-ayuda">Tocá la zona del plano donde ocurre.</p>

    <div class="frente">frente · calle y clientes</div>
    <div class="plano" id="plano"></div>
    <div class="fondo">fondo · trastienda</div>

    <p class="g-resp" id="resp"></p>
    <div id="ficha"></div>
    <div class="g-nota">Sin nota · reintentos ilimitados · el error no descuenta</div>
  </div>
</div>

<script>
/* Las 8 zonas salen literales del guion M4 (Recurso 2). `area` es la celda de la rejilla:
   la geometría vive en los DATOS, no en el motor, para que otro curso traiga su propio plano
   sin tocar el renderer. */
var ZONAS = [
  {id:"sala", area:"sala", nombre:"Sala de clientes", macro:"Sala",
   funcion:"Atención, circulación, pago",
   riesgo:"Obstáculos, información confusa, suciedad visible",
   accion:"Mantener despejada, limpia y con material visible"},
  {id:"caja", area:"caja", nombre:"Caja", macro:"Sala",
   funcion:"Toma de pedidos y pago",
   riesgo:"Errores de atención, desorden operativo",
   accion:"POS encendido, caja abierta, menú/QR disponibles"},
  {id:"arma", area:"arma", nombre:"Zona de armado", macro:"Cocina abierta",
   funcion:"Ensamble de productos",
   riesgo:"Contaminación directa o cruzada",
   accion:"Utensilios limpios, ingredientes protegidos, mesón despejado"},
  {id:"wafl", area:"wafl", nombre:"Wafleras", macro:"Cocina abierta",
   funcion:"Cocción de masas",
   riesgo:"Quemaduras, residuos, mal uso del equipo",
   accion:"Usar herramientas adecuadas, limpiar al cierre, no cerrar calientes"},
  {id:"prel", area:"prel", nombre:"Pre elaboración", macro:"Cocina cerrada",
   funcion:"Preparación previa",
   riesgo:"Contaminación por superficies o manos",
   accion:"Lavado, desinfección, rotulación y orden"},
  {id:"refr", area:"refr", nombre:"Refrigeración", macro:"Cocina cerrada",
   funcion:"Conservación de insumos",
   riesgo:"Pérdida de cadena de frío, sobrecarga, contaminación cruzada",
   accion:"Controlar temperatura, separar categorías, no sobrecargar"},
  {id:"lava", area:"lava", nombre:"Lavado", macro:"Cocina cerrada",
   funcion:"Higiene de utensilios",
   riesgo:"Limpieza incompleta, contaminación, plagas, restos de alimentos",
   accion:"Agua potable, detergente, enjuague y secado correcto"},
  {id:"seco", area:"seco", nombre:"Almacenamiento seco", macro:"Cocina cerrada",
   funcion:"Insumos no refrigerados",
   riesgo:"Plagas, humedad, contaminación química",
   accion:"Mantener fresco, seco, ventilado y separado del suelo"}
];

var plano=document.getElementById("plano"), preg=document.getElementById("preg"),
    resp=document.getElementById("resp"), ficha=document.getElementById("ficha"),
    prog=document.getElementById("prog");
var pendientes=ZONAS.slice(), actual=null, intentos=0, botones={};

ZONAS.forEach(function(z){
  var b=document.createElement("button");
  b.type="button"; b.className="z"; b.style.setProperty("--a",z.area);
  b.setAttribute("aria-label","zona sin identificar");
  b.innerHTML='<span class="n">'+z.nombre+"</span>";
  b.addEventListener("click",function(){elegir(z,b);});
  plano.appendChild(b); botones[z.id]=b;
});

function pedir(){
  if(!pendientes.length){
    preg.textContent="Plano completo.";
    resp.className="g-resp ok"; resp.textContent="Las 8 zonas quedaron ubicadas y rotuladas.";
    ficha.innerHTML=""; return;
  }
  actual=pendientes[0]; intentos=0;
  preg.textContent="¿Dónde ocurre esto? — "+actual.funcion;
  resp.textContent=""; resp.className="g-resp"; ficha.innerHTML="";
}
function elegir(z,b){
  if(!actual||b.classList.contains("puesta"))return;
  if(z.id===actual.id){
    b.classList.add("puesta"); b.classList.remove("mal","pista");
    b.setAttribute("aria-label",z.nombre);
    pendientes.shift();
    prog.textContent=(8-pendientes.length)+" de 8 ubicadas";
    resp.className="g-resp ok"; resp.textContent=intentos?"Ahí es.":"Correcto, a la primera.";
    ficha.innerHTML='<div class="g-ficha"><b>'+z.nombre+" · "+z.macro+"</b><dl>"+
      "<dt>Riesgo</dt><dd>"+z.riesgo+"</dd><dt>Acción</dt><dd>"+z.accion+"</dd></dl></div>";
    var seguir=document.createElement("button");
    seguir.type="button"; seguir.className="g-btn"; seguir.textContent="Siguiente zona";
    seguir.addEventListener("click",pedir); ficha.appendChild(seguir);
    return;
  }
  /* Un toque errado NO es solo "no": nombra la zona que sí es esa. Cada error deja aprendida
     otra zona, así que equivocarse construye el mapa en vez de castigar. */
  intentos++;
  b.classList.add("mal"); setTimeout(function(){b.classList.remove("mal");},320);
  resp.className="g-resp mal";
  resp.textContent="Ahí está "+z.nombre+" — "+z.funcion.toLowerCase()+". Probá de nuevo.";
  if(intentos>=3&&!document.getElementById("ver")){
    var v=document.createElement("button");
    v.type="button"; v.className="g-btn"; v.id="ver"; v.textContent="Ver la respuesta";
    v.addEventListener("click",function(){
      var c=botones[actual.id]; c.classList.add("pista");
      setTimeout(function(){c.classList.remove("pista");elegir(actual,c);},700);
      v.remove();
    });
    ficha.appendChild(v);
  }
}
pedir();

/* Medición de blancos de toque, para contestar con datos y no con opinión. */
window.__medir=function(){
  return ZONAS.map(function(z){
    var r=botones[z.id].getBoundingClientRect();
    return {zona:z.nombre, ancho:Math.round(r.width), alto:Math.round(r.height),
            cumple44:r.width>=44&&r.height>=44};
  });
};
</script>
